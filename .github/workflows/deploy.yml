name: Publicar cardápio na Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_PHOTO_ADMIN_EMAIL: ${{ vars.NEXT_PUBLIC_PHOTO_ADMIN_EMAIL }}
    steps:
      - name: Obter código
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Configurar Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - name: Validar configuração pública
        run: |
          node --input-type=module -e "for (const name of ['NEXT_PUBLIC_SUPABASE_URL', 'NEXT_PUBLIC_SUPABASE_ANON_KEY', 'NEXT_PUBLIC_PHOTO_ADMIN_EMAIL']) { if (!process.env[name]) throw new Error('Configure a variável ' + name); }"
      - name: Instalar dependências
        run: npm ci
      - name: Compilar e verificar TypeScript
        run: npm run build
      - name: Identificar a versão publicada
        run: node scripts/deployment-metadata.mjs
      - name: Publicar na Cloudflare Pages
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Configure o secret CLOUDFLARE_API_TOKEN"; exit 1; }
          npx --yes wrangler@4.151.1 pages deploy out --project-name=cardapio-cacique --branch=main --commit-hash="$GITHUB_SHA"
      - name: Verificar a versão em produção
        run: node scripts/verify-deployment.mjs
